<!-- ==============================================
     HEADER PRINCIPAL - NAVEGAÇÃO
============================================== -->
<nav class="navbar navbar-expand-lg navbar-dark fixed-top">
  <div class="container">
    <!-- Logo e Brand -->
    <a class="navbar-brand" href="#">
      <i class="bi bi-controller"></i> PlayHUB
    </a>
    
    <!-- Botão para menu mobile -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    
    <!-- Conteúdo da navegação -->
    <div class="collapse navbar-collapse" id="navbarNav">
      <!-- Links de navegação principal -->
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link" 
             [ngClass]="{'active': activeLink === 'home'}" 
             (click)="setActiveLink('home')" 
             href="#home">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" 
             [ngClass]="{'active': activeLink === 'games'}" 
             (click)="setActiveLink('games')" 
             href="#games">Jogos</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" 
             [ngClass]="{'active': activeLink === 'categories'}" 
             (click)="setActiveLink('categories')" 
             href="#categories">Categorias</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" 
             [ngClass]="{'active': activeLink === 'community'}" 
             (click)="setActiveLink('community')" 
             href="#community">Comunidade</a>
        </li>
      </ul>
      
      <!-- Formulário de busca -->
      <form class="d-flex">
        <!-- Campo de busca -->
        <input 
          class="form-control me-2 shadow-none" 
          type="search" 
          [(ngModel)]="busca" 
          (input)="onSearch()"
          (focus)="onFocusSearch()"
          (blur)="onBlurSearch()"
          [name]="'search'"
          placeholder="Buscar jogos...">
        
        <!-- Resultados da busca -->
        <div class="search-results" *ngIf="isSearchFocused">
          <!-- Dica de busca -->
          <div *ngIf="busca.length < 3">
            <p class="search-tip">Digite pelo menos 3 caracteres para gerar resultados!</p>
          </div>
          
          <!-- Indicador de carregamento -->
          <div *ngIf="carregandoResultados && busca.length >= 3" class="spinner"></div>
          
          <!-- Lista de resultados encontrados -->
          <div *ngIf="resultadosBusca.length > 0 && busca.length >= 3 && !carregandoResultados" 
               (mousedown)="onResultsMouseDown()">
            <div class="game-item" 
                 *ngFor="let game of resultadosBusca.slice(0, 10)" 
                 (mousedown)="buscarJogo(game.id)">
              <img [src]="game.cover_url" [alt]="game.name">
              <div class="game-info">
                <h4>{{game.name}}</h4>
                <span>{{game?.genres?.join(', ')}}</span>
              </div>
            </div>
          </div>
          
          <!-- Mensagem de nenhum resultado -->
          <div *ngIf="semResultados && busca.length >= 3 && !carregandoResultados" 
               class="search-no-results">
            Não há jogos encontrados para esta busca.
          </div>
        </div>
      </form>
    </div>
  </div>
</nav>
